name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        name: Backend (Pint · Larastan · Pest)
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_DB: testing
                    POSTGRES_USER: sail
                    POSTGRES_PASSWORD: password
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U sail -d testing"
                    --health-interval 5s --health-timeout 5s --health-retries 10

            # .env.example uses Redis for cache/queue/session, so the seed step needs one.
            redis:
                image: redis:alpine
                ports: ['6379:6379']
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s --health-timeout 5s --health-retries 10

        env:
            DB_HOST: 127.0.0.1
            REDIS_HOST: 127.0.0.1

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_pgsql, fileinfo, intl
                  coverage: none

            - name: Cache Composer packages
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - run: composer validate --strict
            - run: composer install --no-interaction --prefer-dist --no-progress

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Migrate and seed (the reviewer's first command)
              run: php artisan migrate --seed --force
              env:
                  DB_DATABASE: testing

            - name: Pint
              run: vendor/bin/pint --test

            - name: Larastan
              run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

            - name: Pest
              run: vendor/bin/pest --ci

            # Cheapest guard against env() used outside config/, which only breaks in production.
            - name: Config cache smoke test
              run: |
                  php artisan config:cache
                  php artisan route:cache
                  php artisan about --only=environment
                  php artisan config:clear

    search:
        name: Search (Meilisearch engine)
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_DB: testing
                    POSTGRES_USER: sail
                    POSTGRES_PASSWORD: password
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U sail -d testing"
                    --health-interval 5s --health-timeout 5s --health-retries 10

            meilisearch:
                image: getmeili/meilisearch:latest
                ports: ['7700:7700']
                env:
                    MEILI_NO_ANALYTICS: 'true'
                options: >-
                    --health-cmd "curl -sf http://localhost:7700/health"
                    --health-interval 5s --health-timeout 5s --health-retries 10

        env:
            DB_HOST: 127.0.0.1
            SCOUT_DRIVER: meilisearch
            MEILISEARCH_HOST: http://127.0.0.1:7700

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_pgsql, fileinfo, intl
                  coverage: none

            - run: composer install --no-interaction --prefer-dist --no-progress

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            # The group skips itself when no engine answers, so assert one is there first:
            # otherwise a broken service would turn into a silently green job.
            - name: Wait for Meilisearch
              run: |
                  for i in $(seq 1 30); do curl -sf http://127.0.0.1:7700/health && exit 0; sleep 2; done
                  echo "Meilisearch never became healthy" && exit 1

            # Proves the documented Meilisearch swap really works, not just the database engine.
            - name: Pest (Meilisearch group)
              run: vendor/bin/pest --group=meilisearch --ci --fail-on-skipped

    frontend:
        name: Frontend (type-check · Vitest · build)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run type-check
            - run: npm test
            - run: npm run build

            - name: Upload build output
              uses: actions/upload-artifact@v4
              with:
                  name: spa-build
                  path: public/build
                  retention-days: 7
